# 实验歌词分支使用独立 workflow 身份，构建步骤复用稳定分支定义。
name: Lyrics Experimental Build

on:
  push:
    branches:
      - feat/lyrics-manager-experiments
    paths:
      - "src/**"
      - "electron/**"
      - "native/**"
      - "shared/**"
      - "public/**"
      - "resources/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron-builder.config.ts"
      - "electron.vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/dev.yml"
      - ".github/workflows/experimental.yml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/dev.yml
